<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2eb">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="library">
        <header class="library-header">
            <p class="eyebrow">A small collection</p>
            <h1>My Library</h1>
            <p class="intro">A quiet place for the books you love.</p>
        </header>

        <section class="shelf-section" aria-labelledby="shelf-heading">
            <div class="shelf-heading">
                <h2 id="shelf-heading">On the shelf</h2>
                <button id="newBookButton" class="new-book-button" type="button">New Book</button>
            </div>
            <ul id="bookShelf" class="book-shelf" aria-label="Books in your library"></ul>
        </section>
    </main>
    <dialog id="bookDialog" aria-labelledby="book-dialog-heading">
        <form id="bookForm">
            <h2 id="book-dialog-heading">Add a book</h2>
            <label>
                Title
                <input name="title" type="text" required>
            </label>
            <label>
                Author
                <input name="author" type="text" required>
            </label>
            <label>
                Pages
                <input name="pages" type="number" min="1" step="1" required>
            </label>
            <label class="read-option">
                <input name="read" type="checkbox">
                I have read this book
            </label>
            <div class="dialog-actions">
                <button id="cancelBookButton" type="button">Cancel</button>
                <button type="submit">Add Book</button>
            </div>
        </form>
    </dialog>
    <script src="script.js" defer></script>
</body>
</html>
